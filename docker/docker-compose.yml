services:

  postgres:
    image: postgres:16

    container_name: matrix-crm-postgres

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: matrix_crm

    ports:
      - "55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: